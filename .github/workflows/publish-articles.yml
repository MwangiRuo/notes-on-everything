name: Publish article pages and sitemap
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/build_articles.py'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install 'Markdown>=3.6,<4' 'PyYAML>=6,<7'
      - name: Generate standalone pages and sitemap
        run: python scripts/build_articles.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated article pages and sitemap"
            git push
          fi
