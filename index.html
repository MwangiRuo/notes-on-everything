</style><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script></head><body><header class="header wrap"><a href="#/" class="brand" aria-label="Notes on Everything home"><svg class="flourish" viewBox="0 0 90 70" role="img" aria-label="Flourish signature"><path d="M8 60C26 15 52 14 77 12 M8 60C39 57 61 29 77 12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M70 18L81 7" stroke="#ad5d3a" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="23" r="4.5" fill="#ad5d3a"/></svg><span>Notes on Everything<b>.</b></span></a><nav class="nav" aria-label="Main navigation"><a href="#/">Home</a><a href="#/writing">Writing</a><a href="#/about">About</a><a href="#/contact">Contact</a></nav><div class="tools"><button class="iconbtn" onclick="location.hash='#/writing';setTimeout(()=>document.getElementById('search')?.focus(),50)" aria-label="Search articles">⌕</button><button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">◐</button></div></header><main id="app"></main><footer class="footer"><span>© <span id="year"></span> Notes on Everything. · By Lenny Mwangi Ruo</span><span><a href="https://app.pagescms.org/mwangiruo/notes-on-everything/main" target="_blank" rel="noopener noreferrer">Author sign-in</a><a href="#/contact">Contact</a></span></footer><script>
const KEY='noe.posts.v1',DRAFT='noe.draft.v1';let initial=[];
let cmsPosts=[];function getPosts(){try{let p=JSON.parse(localStorage.getItem(KEY));return [...cmsPosts,...(Array.isArray(p)?p:(cmsPosts.length?[]:initial))]}catch{return [...cmsPosts,...(cmsPosts.length?[]:initial)]}}function savePosts(p){localStorage.setItem(KEY,JSON.stringify(p))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function strip(s){return document.createElement('div').appendChild(document.createTextNode(s||'')).parentNode.textContent}function textOf(html){let d=document.createElement('div');d.innerHTML=html;return d.textContent||''}function mins(p){return Math.max(1,Math.ceil(textOf(p.html).split(/\s+/).filter(Boolean).length/220))}function safeHTML(html){let doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,svg,link,meta').forEach(x=>x.remove());doc.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(a.name.startsWith('on')||a.name==='style'||((a.name==='href'||a.name==='src')&&!/^(https?:|mailto:|\/|assets\/|#)/i.test(a.value)))el.removeAttribute(a.name)})});return doc.body.innerHTML}function card(p){return `<article class="post-card" tabindex="0" role="link" onclick="location.hash='#/post/${encodeURIComponent(p.id)}'" onkeydown="if(event.key==='Enter')this.click()"><img src="assets/${esc(p.image||'life')}.webp" alt="Editorial image accompanying ${esc(p.title)}"><div class="eyebrow">${esc(p.topic||'Notes')}</div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt||'')}</p><span class="readtime">◷ ${mins(p)} MIN READ${p.sample?' · SAMPLE':''}</span></article>`}function home(){let posts=getPosts().filter(p=>p.published);return `<section class="hero"><div class="hero-copy"><h1>Notes on<br>Everything<b>.</b></h1><p class="tagline">Nothing in particular. Everything, eventually.</p><div class="dash"></div><div class="byline">By Lenny Mwangi Ruo</div></div><div class="hero-photo" role="img" aria-label="Sunlit white plaster wall, olive branch shadows, and an empty terracotta vase"></div></section><section class="section wrap"><div class="section-head"><h2>Recent Writing</h2><a href="#/writing">View all →</a></div><div class="cards">${posts.slice(0,4).map(card).join('')||'<p>No published writing yet. Visit the Writing desk to publish your first note.</p>'}</div></section>${newsletter()}`}
function newsletter(){return `<section class="newsletter"><div class="wrap"><div><h3>Occasional correspondence.</h3><p>New writing, delivered when there’s something worth sharing.</p></div><form class="subscribe" action="https://buttondown.com/api/emails/embed-subscribe/ruo" method="post" target="_blank"><input type="email" name="email" required autocomplete="email" placeholder="Your email address" aria-label="Your email address"><button class="primary" type="submit">Subscribe</button></form></div></section>`}
function writing(){let posts=getPosts().filter(p=>p.published);return `<section class="page"><h1>Writing.</h1><p class="intro">Everything in one place. No particular order of importance.</p><div class="toolbar"><input class="field" id="search" placeholder="Search writing…" oninput="filterPosts()" aria-label="Search writing"><select class="field" id="topic" onchange="filterPosts()" aria-label="Filter topic"><option value="">All topics</option>${[...new Set(posts.map(p=>p.topic).filter(Boolean))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div id="results">${posts.map(listPost).join('')}</div></section>`}function listPost(p){return `<article class="listpost" onclick="location.hash='#/post/${encodeURIComponent(p.id)}'"><div class="eyebrow">${esc(p.topic||'Notes')} · ${mins(p)} MIN READ${p.sample?' · SAMPLE':''}</div><h2>${esc(p.title)}</h2><p>${esc(p.excerpt||'')}</p></article>`}function filterPosts(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('topic').value;let p=getPosts().filter(p=>p.published&&(!t||p.topic===t)&&[p.title,p.excerpt,p.topic,textOf(p.html)].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=p.map(listPost).join('')||'<p>No matching notes.</p>'}
function post(id){let p=getPosts().find(x=>x.id===id&&x.published);if(!p)return notfound();return `<article class="page article"><a class="textlink" href="#/writing">← All writing</a><div class="eyebrow" style="margin-top:40px">${esc(p.topic||'Notes')} · ${mins(p)} MIN READ${p.sample?' · SAMPLE ARTICLE':''}</div><h1>${esc(p.title)}</h1><p class="intro">${esc(p.excerpt||'')}</p><div class="dash" style="margin-top:30px"></div><div class="article-body">${safeHTML(p.html)}</div><section class="comments"><h2>Conversation</h2><p class="small">Public comments will be enabled after a moderated commenting service is connected. No comments are being sent or stored on a server in this preview.</p></section></article>`}
function about(){return `<section class="page"><h1>About.</h1><p class="intro">Notes on Everything is an independent space for curiosity, reflection, and the occasional tangent, written by Lenny Mwangi Ruo.</p><p class="intro">Some notes begin with a book, others with a conversation, a question, or something ordinary that refuses to leave the mind. Here, there is room for all of them.</p><p class="intro">Nothing in particular. Everything, eventually.</p></section>`}function contact(){return `<section class="page"><h1>Contact.</h1><p class="intro">For questions, ideas, and conversations about the writing.</p><p>Direct contact details will be added here soon. Until then, you can read the latest notes on the <a class="textlink" href="#/writing">Writing page</a>.</p></section>`}
function editor(){let draft;try{draft=JSON.parse(localStorage.getItem(DRAFT))||{}}catch{draft={}}return `<section class="page"><h1>The writing desk.</h1><p class="intro">Write here or paste from Word or Google Docs. Save drafts and publish in this browser.</p><div class="note"><b>Local preview:</b> Your drafts and published articles are saved in this browser only. They won't sync across devices or appear online until we connect a real publishing system. Back up anything important.</div><div class="stack"><label>Title<input class="field" id="ed-title" placeholder="An interesting title" value="${esc(draft.title||'')}"></label><label>Topic (optional)<input class="field" id="ed-topic" placeholder="Life, Health, Ideas…" value="${esc(draft.topic||'')}"></label><label>Short introduction (optional)<textarea class="field" id="ed-excerpt" placeholder="One or two sentences…">${esc(draft.excerpt||'')}</textarea></label><label>Article</label><div id="ed-body" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Begin writing here…">${safeHTML(draft.html||'<p>Start writing here, or paste your work from Word or Google Docs.</p>')}</div></div><div class="actions"><button class="secondary" onclick="document.execCommand('bold')"><b>B</b></button><button class="secondary" onclick="document.execCommand('italic')"><i>I</i></button><button class="secondary" onclick="document.execCommand('formatBlock',false,'h2')">Heading</button><button class="secondary" onclick="document.execCommand('insertUnorderedList')">• List</button></div><div class="actions"><button class="secondary" onclick="saveDraft()">Save draft</button><button class="primary" onclick="publish()">Publish in preview</button><button class="secondary" onclick="exportDraft()">Download backup</button></div><p class="small" id="ed-status"></p><h2 style="font:28px Georgia,serif;margin-top:55px">Your posts</h2><div id="manage-posts">${managePosts()}</div></section>`}function edData(){return{title:document.getElementById('ed-title').value.trim(),topic:document.getElementById('ed-topic').value.trim(),excerpt:document.getElementById('ed-excerpt').value.trim(),html:safeHTML(document.getElementById('ed-body').innerHTML)}}function saveDraft(){localStorage.setItem(DRAFT,JSON.stringify(edData()));document.getElementById('ed-status').textContent='Draft saved in this browser.'}function publish(){let d=edData();if(!d.title){alert('Add a title first.');return}if(!textOf(d.html).trim()){alert('Write something first.');return}let p=getPosts();p.unshift({...d,id:'post-'+Date.now(),published:true,image:'life',sample:false});savePosts(p);localStorage.removeItem(DRAFT);alert('Published in this local preview. It is not live on the internet.');location.hash='#/writing'}function exportDraft(){let blob=new Blob([JSON.stringify(edData(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='notes-on-everything-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function managePosts(){return getPosts().map(p=>`<div class="listpost"><strong>${esc(p.title)}</strong> <span class="small">${p.sample?'Sample · ':''}${p.published?'Published in preview':'Draft'}</span><div class="actions"><button class="secondary" onclick="editPost('${esc(p.id)}')">Edit</button><button class="secondary" onclick="deletePost('${esc(p.id)}')">Delete</button></div></div>`).join('')}function editPost(id){let p=getPosts().find(x=>x.id===id);if(!p)return;localStorage.setItem(DRAFT,JSON.stringify(p));savePosts(getPosts().filter(x=>x.id!==id));render();window.scrollTo(0,0)}function deletePost(id){if(!confirm('Delete this post from this browser?'))return;savePosts(getPosts().filter(x=>x.id!==id));render()}function notfound(){return `<section class="page"><h1>Not found.</h1><a href="#/">Return home →</a></section>`}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('noe.theme',document.body.classList.contains('dark')?'dark':'light')}function render(){let path=decodeURIComponent(location.hash.slice(1)||'/').split('/').filter(Boolean);document.getElementById('app').innerHTML=!path.length?home():path[0]==='writing'?writing():path[0]==='post'?post(path.slice(1).join('/')):path[0]==='about'?about():path[0]==='contact'?contact():path[0]==='editor'?'<section class="page"><h1>Writing desk.</h1><p>Articles are now managed through <a class="textlink" href="https://app.pagescms.org/mwangiruo/notes-on-everything/main">Pages CMS</a>.</p></section>':notfound();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+(path[0]||'')));document.title=(path[0]&&path[0]!=='post'?path[0][0].toUpperCase()+path[0].slice(1)+' · ':'')+'Notes on Everything.';window.scrollTo(0,0)}if(localStorage.getItem('noe.theme')==='dark')document.body.classList.add('dark');document.getElementById('year').textContent=new Date().getFullYear();window.addEventListener('hashchange',render);render();

// Articles are stored as Markdown by Pages CMS in the public GitHub repository.
const REPO_API='https://api.github.com/repos/MwangiRuo/notes-on-everything/contents/posts';
function parseCmsMarkdown(raw,filename){
  let metadata={},body=raw;
  if(raw.startsWith('---')){
    const match=raw.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
    if(match){body=raw.slice(match[0].length);for(const line of match[1].split(/\r?\n/)){const kv=line.match(/^([\w-]+):\s*(.*)$/);if(kv){let v=kv[2].trim();if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))v=v.slice(1,-1);metadata[kv[1]]=v;}}}
  }
  if(metadata.draft==='true'||metadata.published==='false')return null;
  const html=window.marked?window.marked.parse(body):'<p>'+esc(body).replace(/\n\n/g,'</p><p>')+'</p>';
  const title=metadata.title||filename.replace(/\.md$/,'').replace(/[-_]/g,' ');
  return {id:'cms-'+filename,title,topic:metadata.topic||'Notes',excerpt:metadata.description||metadata.excerpt||'',image:'life',html:safeHTML(html),date:metadata.date||'',published:true,sample:false};
}
async function loadCmsPosts(){
  try{
    const response=await fetch(REPO_API,{headers:{Accept:'application/vnd.github+json'}});
    if(response.status===404){cmsPosts=[];return;}
    if(!response.ok)throw new Error('GitHub API '+response.status);
    const files=(await response.json()).filter(f=>f.type==='file'&&f.name.toLowerCase().endsWith('.md'));
    const loaded=await Promise.all(files.map(async f=>{
      try{const r=await fetch(f.download_url);if(!r.ok)throw new Error('Article unavailable');return parseCmsMarkdown(await r.text(),f.name)}catch(e){console.warn('Unable to load article',f.name,e);return null}
    }));
    cmsPosts=loaded.filter(Boolean).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(cmsPosts.length){localStorage.removeItem('noe.posts.v1');}
    render();
  }catch(e){console.warn('Articles could not be loaded; showing existing preview.',e)}
}
window.addEventListener('load',loadCmsPosts);
