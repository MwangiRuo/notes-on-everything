media:
  input: assets
  output: /assets

content:
  - name: posts
    label: Articles
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, description]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
      - name: description
        label: Description
        type: text
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
